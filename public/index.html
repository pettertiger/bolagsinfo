<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17483d">
  <title>Intranät | Lantero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --forest: #17483d;
      --forest-dark: #12382f;
      --leaf: #c4d58a;
      --ink: #24332e;
      --muted: #6a7771;
      --canvas: #f4f5f0;
      --paper: #fff;
      --line: #dce2dc;
      --soft-green: #eaf0e8;
      --shadow: 0 12px 32px rgba(24, 54, 44, .08);
      font-family: "DM Sans", "Avenir Next", sans-serif;
      color: var(--ink);
      background: var(--canvas);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    [hidden], .visually-hidden { display: none !important; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: "Manrope", "DM Sans", sans-serif; letter-spacing: 0; }

    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: var(--forest); color: white; border-bottom: 1px solid rgba(0,0,0,.1); }
    .topbar-inner { max-width: 1380px; min-height: 72px; margin: auto; padding: 0 36px; display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; }
    .brand { display: flex; align-items: center; gap: 13px; color: white; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.45); border-radius: 50% 50% 50% 10%; color: var(--leaf); font-family: "Manrope", sans-serif; font-size: 18px; font-weight: 800; transform: rotate(-8deg); }
    .brand-name { font-family: "Manrope", sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0; }
    .brand-divider { height: 24px; width: 1px; background: rgba(255,255,255,.28); }
    .product-name { font-size: 13px; color: rgba(255,255,255,.8); }
    .user-area { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.82); }
    .auth-dot { width: 8px; height: 8px; border-radius: 50%; background: #efc17e; box-shadow: 0 0 0 4px rgba(239,193,126,.14); }
    .admin-link { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid rgba(255,255,255,.28); border-radius: 3px; color: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; text-decoration: none; }
    .admin-link:hover { background: rgba(255,255,255,.1); }

    main { max-width: 1380px; margin: auto; padding: 30px 36px 76px; width: 100%; }
    .breadcrumbs { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 12px; }
    .breadcrumbs a { text-decoration: none; }
    .breadcrumbs a:hover { text-decoration: underline; }
    .breadcrumbs span:last-child { color: var(--ink); }
    .page-head { margin: 23px 0 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--forest); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin-bottom: 7px; font-size: clamp(28px, 3vw, 38px); line-height: 1.12; font-weight: 700; }
    .page-subtitle { margin: 0; color: var(--muted); font-size: 15px; }

    .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
    .section-card { background: white; border: 1px solid var(--line); border-radius: 4px; padding: 24px; text-decoration: none; color: inherit; transition: all 0.2s; box-shadow: 0 2px 8px rgba(24, 54, 44, .04); }
    .section-card:hover { border-color: var(--forest); box-shadow: var(--shadow); transform: translateY(-2px); }
    .section-card-icon { font-size: 28px; margin-bottom: 12px; display: block; }
    .section-card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .section-card-description { color: var(--muted); font-size: 13px; line-height: 1.6; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 48px; display: block; margin-bottom: 16px; }
    .empty-state h2 { margin-bottom: 8px; }
    .empty-state p { color: var(--muted); margin-bottom: 24px; }

    .footer { border-top: 1px solid var(--line); padding: 20px 36px 30px; background: white; color: var(--muted); font-size: 12px; text-align: center; }

    @media (max-width: 768px) {
      .topbar-inner { padding: 0 20px; }
      main { padding: 20px 20px 60px; }
      .admin-link { font-size: 11px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span class="brand-name">lantero</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="product-name">Intranät</span>
        </a>
        <div class="user-area">
          <span class="auth-dot" aria-hidden="true"></span>
          <span>Microsoft-inloggning</span>
          <a href="/admin.html" class="admin-link" title="Admin-panel för att hantera intranätavsnitt">⚙️ Admin</a>
        </div>
      </div>
    </header>

    <main>
      <div class="breadcrumbs" aria-label="Brödsmulor">
        <a href="/">Lantero</a>
        <span aria-hidden="true">/</span>
        <span>Intranät</span>
      </div>
      <div class="page-head">
        <div>
          <p class="eyebrow">Välkommen</p>
          <h1>Lanteros intranät</h1>
          <p class="page-subtitle">En centraliserad plats för information om att arbeta på Lantero och vår kundöversikt</p>
        </div>
      </div>

      <div id="sections-container"></div>
    </main>

    <footer class="footer">
      <span>Lantero · Intranät</span>
      <span style="margin-left: 20px;">Förhandsversion</span>
    </footer>
  </div>

  <script type="module">
    const SECTION_CONFIG = {
      anstalld: {
        name: 'Anställd',
        description: 'Information för anställda: rutiner, frånvaro, helgdagar och arbetsvillkor.',
        url: '/anstalld.html',
        icon: '👤'
      },
      kunder: {
        name: 'Kunder & Kontrakt',
        description: 'Kundöversikt, avtalsöversikt, nya affärer och säljstatus.',
        url: '/kunder.html',
        icon: '🏢'
      },
      media: {
        name: 'Media & Digitalt',
        description: 'Mediaöversikt, webbtrafik-dashboard, statistik och publikationer.',
        url: '/media.html',
        icon: '📊'
      },
      resurser: {
        name: 'Resurser & Utveckling',
        description: 'Verktyg, dokumentation, kunskapsbank och utvecklingsöversikt.',
        url: '/resurser.html',
        icon: '📚'
      },
      'om-lantero': {
        name: 'Om Lantero',
        description: 'Om företaget, värderingar, organisation och kontaktinformation.',
        url: '/om-lantero.html',
        icon: 'ℹ️'
      }
    };

    async function loadActiveSections() {
      try {
        const response = await fetch('/api/sections');
        if (!response.ok) throw new Error('API error');
        return await response.json();
      } catch (error) {
        console.error('Fel vid hämtning av sektioner:', error);
        return { anstalld: true };
      }
    }

    async function renderSections() {
      const activeSections = await loadActiveSections();
      const container = document.getElementById('sections-container');
      
      const activeSectionIds = Object.entries(activeSections)
        .filter(([_, isActive]) => isActive)
        .map(([id]) => id)
        .sort((a, b) => {
          const order = ['anstalld', 'kunder', 'media', 'resurser', 'om-lantero'];
          return order.indexOf(a) - order.indexOf(b);
        });

      if (activeSectionIds.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-state-icon">📭</span>
            <h2>Ingen innehål ännu</h2>
            <p>Intranätets sektioner läggs till successivt. Kontakta administratören för mer information.</p>
          </div>
        `;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'section-grid';

      activeSectionIds.forEach(sectionId => {
        const config = SECTION_CONFIG[sectionId];
        if (!config) return;

        const card = document.createElement('a');
        card.href = config.url;
        card.className = 'section-card';
        card.innerHTML = `
          <span class="section-card-icon">${config.icon}</span>
          <h2 class="section-card-title">${config.name}</h2>
          <p class="section-card-description">${config.description}</p>
        `;
        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);
    }

    renderSections();
  </script>
</body>
</html>
