<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Intranät Admin | Lantero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --forest: #17483d;
      --forest-dark: #12382f;
      --leaf: #c4d58a;
      --ink: #24332e;
      --muted: #6a7771;
      --canvas: #f4f5f0;
      --paper: #fff;
      --line: #dce2dc;
      --soft-green: #eaf0e8;
      --shadow: 0 12px 32px rgba(24, 54, 44, .08);
      font-family: "DM Sans", "Avenir Next", sans-serif;
      color: var(--ink);
      background: var(--canvas);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    [hidden], .visually-hidden { display: none !important; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: "Manrope", "DM Sans", sans-serif; letter-spacing: 0; }

    .shell { min-height: 100vh; }
    .topbar { background: white; color: var(--ink); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1380px; min-height: 72px; margin: auto; padding: 0 36px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 13px; color: var(--ink); text-decoration: none; }
    .brand-logo { display: block; width: auto; height: 52px; }
    .brand-divider { height: 24px; width: 1px; background: var(--line); }
    .product-name { font-size: 13px; color: var(--muted); }
    main { max-width: 1120px; margin: auto; padding: 30px 36px 76px; }
    .page-head { margin: 23px 0 25px; }
    .eyebrow { margin: 0 0 8px; color: var(--forest); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin-bottom: 7px; font-size: 32px; line-height: 1.12; font-weight: 700; }
    .page-subtitle { margin: 0; color: var(--muted); font-size: 15px; }

    .sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
    .section-card { background: white; border: 1px solid var(--line); border-radius: 4px; padding: 20px; box-shadow: var(--shadow); }
    .section-card.active { border-color: var(--forest); background: #f9faf8; }
    .section-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-header h3 { margin: 0; font-size: 16px; }
    .section-toggle { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .toggle-switch { position: relative; width: 48px; height: 28px; background: #ddd; border: none; border-radius: 14px; cursor: pointer; transition: background 0.3s; }
    .toggle-switch.active { background: var(--forest); }
    .toggle-switch::before { content: ""; position: absolute; width: 24px; height: 24px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: left 0.3s; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
    .toggle-switch.active::before { left: 22px; }
    .section-description { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
    .section-status { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .section-status.active { background: #e8f5e1; color: #2d6e2a; }
    .section-status.inactive { background: #f0f0f0; color: #666; }
    .section-url { color: var(--muted); font-size: 12px; margin-top: 12px; font-family: monospace; }

    .note-box { background: #fbf0e3; border: 1px solid #e8d5b7; border-radius: 4px; padding: 16px; margin-top: 24px; font-size: 13px; line-height: 1.6; color: #5a4a2a; }
    .note-box strong { color: #3a2a0a; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand">
          <img src="lantero-logo.png" alt="Lantero" class="brand-logo">
          <div class="brand-divider"></div>
          <span class="product-name">Intranät Admin</span>
        </a>
      </div>
    </header>

    <main>
      <div class="page-head">
        <div>
          <p class="eyebrow">Konfiguration</p>
          <h1>Hantera intranätavsnitt</h1>
          <p class="page-subtitle">Aktivera och deaktivera sektioner för att styra vad som visas i intranätet för medarbetare</p>
        </div>
      </div>

      <div class="sections-grid" id="sections-container">
        <!-- Fylls av JavaScript -->
      </div>

      <div class="note-box">
        <strong>💡 Tip:</strong> Aktivera avsnitt när de är klara för att visa dem för medarbetare. 
        Bara aktiva avsnitt visas i navigationen och på startsidan.
      </div>
    </main>
  </div>

  <script type="module">
    const SECTIONS = [
      {
        id: 'anstalld',
        name: 'Anställd',
        description: 'Information för anställda: rutiner, frånvaro, helgdagar etc.',
        url: '/anstalld.html',
        icon: '👤'
      },
      {
        id: 'kunder',
        name: 'Kunder & Kontrakt',
        description: 'Kundöversikt, avtalsöversikt, nya affärer och säljstatus.',
        url: '/kunder.html',
        icon: '🏢',
        comingSoon: true
      },
      {
        id: 'media',
        name: 'Media & Digitalt',
        description: 'Mediaöversikt, webbtrafik-dashboard och publikationer.',
        url: '/media.html',
        icon: '📊',
        comingSoon: true
      },
      {
        id: 'resurser',
        name: 'Resurser & Utveckling',
        description: 'Verktyg, dokumentation och utvecklingsöversikt.',
        url: '/resurser.html',
        icon: '📚',
        comingSoon: true
      },
      {
        id: 'om-lantero',
        name: 'Om Lantero',
        description: 'Om företaget, värderingar, organisation och kontaktinfo.',
        url: '/om-lantero.html',
        icon: 'ℹ️',
        comingSoon: true
      }
    ];

    async function loadSectionStates() {
      try {
        const response = await fetch('/api/sections');
        return await response.json();
      } catch (error) {
        console.error('Fel vid hämtning av sektioner:', error);
        return {};
      }
    }

    async function saveSectionState(sectionId, active) {
      try {
        const response = await fetch('/api/sections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sectionId, active })
        });
        return await response.json();
      } catch (error) {
        console.error('Fel vid sparning av sektion:', error);
      }
    }

    async function renderSections() {
      const states = await loadSectionStates();
      const container = document.getElementById('sections-container');
      container.innerHTML = '';

      SECTIONS.forEach(section => {
        const isActive = states[section.id] ?? section.id === 'anstalld';
        const card = document.createElement('div');
        card.className = `section-card ${isActive ? 'active' : ''}`;

        const statusText = section.comingSoon 
          ? 'Kommer snart' 
          : (isActive ? 'Aktiverad' : 'Inaktiv');

        let toggleHtml = '';
        if (!section.comingSoon) {
          toggleHtml = `
            <div class="section-toggle">
              <button class="toggle-switch ${isActive ? 'active' : ''}" 
                      data-section="${section.id}"
                      aria-label="Slå ${isActive ? 'av' : 'på'} ${section.name}"></button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="section-header">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="font-size: 24px;">${section.icon}</span>
              <h3>${section.name}</h3>
            </div>
            ${toggleHtml}
          </div>
          <p class="section-description">${section.description}</p>
          <span class="section-status ${section.comingSoon ? 'inactive' : (isActive ? 'active' : 'inactive')}">${statusText}</span>
          <div class="section-url">URL: ${section.url}</div>
        `;

        if (!section.comingSoon) {
          const button = card.querySelector('.toggle-switch');
          button.addEventListener('click', async (e) => {
            e.preventDefault();
            const newState = !isActive;
            await saveSectionState(section.id, newState);
            renderSections();
          });
        }

        container.appendChild(card);
      });
    }

    renderSections();
  </script>
</body>
</html>
