<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Innehåll | Lantero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --forest: #17483d;
      --ink: #24332e;
      --muted: #6a7771;
      --canvas: #f4f5f0;
      --line: #dce2dc;
      --shadow: 0 12px 32px rgba(24, 54, 44, .08);
      font-family: "DM Sans", "Avenir Next", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    h1, h2, p { margin-top: 0; }
    h1, h2 { font-family: "Manrope", "DM Sans", sans-serif; }
    .topbar { background: white; border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1380px; min-height: 72px; margin: auto; padding: 0 36px; display: flex; align-items: center; gap: 13px; }
    .brand { display: flex; align-items: center; gap: 13px; color: var(--ink); text-decoration: none; }
    .brand-logo { display: block; width: auto; height: 52px; }
    .brand-divider { width: 1px; height: 24px; background: var(--line); }
    .product-name { color: var(--muted); font-size: 13px; }
    main { max-width: 1120px; margin: auto; padding: 30px 36px 76px; }
    .breadcrumbs { display: flex; gap: 9px; color: var(--muted); font-size: 12px; }
    .breadcrumbs a { color: inherit; text-decoration: none; }
    .page-head { margin: 23px 0 25px; }
    .eyebrow { margin-bottom: 8px; color: var(--forest); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin-bottom: 7px; font-size: clamp(28px, 3vw, 38px); line-height: 1.12; }
    .page-subtitle { color: var(--muted); font-size: 15px; }
    .content-block { max-width: 820px; margin-bottom: 22px; padding: 22px 24px; border: 1px solid var(--line); background: white; box-shadow: var(--shadow); }
    .content-block h2 { margin-bottom: 10px; font-size: 20px; }
    .content-block p { margin: 0; color: #46564e; font-size: 14px; line-height: 1.7; }
    #page-status { color: #a34f4d; font-size: 13px; }
    @media (max-width: 760px) {
      .topbar-inner { min-height: 64px; padding: 0 20px; }
      .brand-logo { height: 48px; }
      main { padding: 24px 20px 56px; }
      .content-block { padding: 19px 18px; }
    }
    @media (max-width: 480px) {
      .topbar-inner { padding: 0 16px; }
      main { padding-right: 15px; padding-left: 15px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Lantero, startsida">
        <img class="brand-logo" src="/lantero-logo.png" alt="">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="product-name">Intranät</span>
      </a>
    </div>
  </header>
  <main>
    <nav class="breadcrumbs" aria-label="Brödsmulor">
      <a href="/">Lantero</a><span aria-hidden="true">/</span><span id="breadcrumb-section">Innehåll</span>
    </nav>
    <header class="page-head">
      <p class="eyebrow">Intranät</p>
      <h1 id="page-title">Laddar avsnitt …</h1>
      <p class="page-subtitle" id="page-description"></p>
    </header>
    <p id="page-status" role="status" aria-live="polite"></p>
    <div id="managed-content"></div>
  </main>
  <script type="module">
    import { loadPublishedSections, renderSectionContent } from '/intranet-content.js';

    const sectionId = new URLSearchParams(window.location.search).get('id');
    const title = document.getElementById('page-title');
    const description = document.getElementById('page-description');
    const breadcrumb = document.getElementById('breadcrumb-section');
    const status = document.getElementById('page-status');
    const content = document.getElementById('managed-content');

    try {
      if (!sectionId) throw new Error('Avsnittet saknas i länken.');
      const sections = await loadPublishedSections();
      const section = sections.find(item => item.id === sectionId);
      if (!section) throw new Error('Avsnittet är inte aktiverat eller tillgängligt för dig.');
      title.textContent = section.name;
      breadcrumb.textContent = section.name;
      document.title = `${section.name} | Lantero`;
      description.textContent = section.description || '';
      renderSectionContent(section, content);
      if (section.content.length === 0) status.textContent = 'Innehåll har ännu inte lagts till i det här avsnittet.';
    } catch (error) {
      title.textContent = 'Avsnittet kunde inte visas';
      status.textContent = error.message;
    }
  </script>
</body>
</html>
